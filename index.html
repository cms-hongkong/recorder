<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角鐵音頻播放器 | Triangle Audio Player</title>
    <style>
        /* 基本樣式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft JhengHei', 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        /* 播放器區域 */
        .player {
            margin: 30px 0;
        }
        
        audio {
            width: 100%;
            height: 50px;
            margin: 15px 0;
            outline: none;
        }
        
        /* 按鈕樣式 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 120px;
        }
        
        .play-btn {
            background: #4CAF50;
            color: white;
        }
        
        .play-btn:hover {
            background: #45a049;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        
        .pause-btn {
            background: #ff9800;
            color: white;
        }
        
        .pause-btn:hover {
            background: #e68a00;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }
        
        .stop-btn {
            background: #f44336;
            color: white;
        }
        
        .stop-btn:hover {
            background: #da190b;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }
        
        /* 音量控制 */
        .volume-container {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        
        .volume-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #333;
            font-weight: bold;
        }
        
        .volume-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #6a11cb;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        /* 時間顯示 */
        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
        
        /* 狀態訊息 */
        .status {
            margin: 20px 0;
            padding: 10px;
            border-radius: 5px;
            background: #e8f5e8;
            color: #2e7d32;
            display: none;
        }
        
        /* 檔案上傳 */
        .upload-area {
            border: 3px dashed #ccc;
            border-radius: 10px;
            padding: 30px;
            margin: 25px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: #6a11cb;
            background: #f9f9ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
            color: #6a11cb;
        }
        
        /* 響應式設計 */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .btn {
                min-width: 100px;
                padding: 10px 20px;
            }
            
            .controls {
                gap: 10px;
            }
        }
        
        /* 頁尾 */
        footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        
        .emoji {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🎵</div>
        <h1>三角鐵音頻播放器</h1>
        <p class="subtitle">Triangle Audio Player - MP3 播放測試</p>
        
        <!-- 狀態訊息 -->
        <div id="statusMessage" class="status">
            正在加載音頻檔案...
        </div>
        
        <!-- 播放器 -->
        <div class="player">
            <audio id="audioPlayer" controls>
                <source src="triangle.mp3" type="audio/mpeg">
                您的瀏覽器不支持音頻播放，請使用 Chrome、Firefox 或 Edge。
            </audio>
            
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>
        
        <!-- 控制按鈕 -->
        <div class="controls">
            <button class="btn play-btn" id="playBtn">
                ▶️ 播放
            </button>
            <button class="btn pause-btn" id="pauseBtn">
                ⏸️ 暫停
            </button>
            <button class="btn stop-btn" id="stopBtn">
                ⏹️ 停止
            </button>
        </div>
        
        <!-- 音量控制 -->
        <div class="volume-container">
            <div class="volume-label">
                🔊 音量控制
                <span id="volumeValue">100%</span>
            </div>
            <input type="range" 
                   id="volumeSlider" 
                   class="volume-slider" 
                   min="0" 
                   max="1" 
                   step="0.01" 
                   value="1">
        </div>
        
        <!-- 檔案上傳 -->
        <div class="upload-area" onclick="document.getElementById('fileUpload').click()">
            <div class="upload-icon">📁</div>
            <h3>上傳其他音頻檔案</h3>
            <p>點擊這裡選擇 MP3、WAV、OGG 等格式</p>
            <input type="file" 
                   id="fileUpload" 
                   accept="audio/*" 
                   style="display: none;">
        </div>
        
        <!-- 頁尾資訊 -->
        <footer>
            <p>GitHub Pages 音頻播放器</p>
            <p>檔案：triangle.mp3 | 使用 Web Audio API</p>
            <p>如果無法播放，請檢查音頻檔案是否已上傳</p>
        </footer>
    </div>

    <script>
        // 獲取所有需要的元素
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const fileUpload = document.getElementById('fileUpload');
        const statusMessage = document.getElementById('statusMessage');
        
        // 顯示狀態訊息
        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.style.display = 'block';
            
            if (type === 'error') {
                statusMessage.style.background = '#ffebee';
                statusMessage.style.color = '#c62828';
            } else if (type === 'success') {
                statusMessage.style.background = '#e8f5e8';
                statusMessage.style.color = '#2e7d32';
            }
            
            // 3秒後自動隱藏
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 3000);
        }
        
        // 檢查音頻是否成功加載
        audio.addEventListener('loadeddata', function() {
            showStatus('✅ 音頻加載成功！點擊播放按鈕開始', 'success');
            updateTimeDisplay();
        });
        
        audio.addEventListener('error', function(e) {
            console.error('音頻錯誤:', e);
            showStatus('❌ 無法加載音頻檔案，請確認 triangle.mp3 已上傳', 'error');
        });
        
        // 播放功能
        playBtn.addEventListener('click', function() {
            audio.play().then(() => {
                showStatus('▶️ 正在播放...', 'success');
            }).catch(error => {
                showStatus('❌ 播放失敗：' + error.message, 'error');
            });
        });
        
        // 暫停功能
        pauseBtn.addEventListener('click', function() {
            audio.pause();
            showStatus('⏸️ 已暫停', 'info');
        });
        
        // 停止功能
        stopBtn.addEventListener('click', function() {
            audio.pause();
            audio.currentTime = 0;
            showStatus('⏹️ 已停止', 'info');
        });
        
        // 音量控制
        volumeSlider.addEventListener('input', function() {
            const volume = this.value;
            audio.volume = volume;
            volumeValue.textContent = Math.round(volume * 100) + '%';
        });
        
        // 時間格式化
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // 更新時間顯示
        function updateTimeDisplay() {
            currentTimeEl.textContent = formatTime(audio.currentTime);
            if (audio.duration) {
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        }
        
        // 監聽時間更新
        audio.addEventListener('timeupdate', updateTimeDisplay);
        
        // 監聽音頻加載完成
        audio.addEventListener('loadedmetadata', function() {
            totalTimeEl.textContent = formatTime(audio.duration);
        });
        
        // 檔案上傳功能
        fileUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // 檢查是否為音頻檔案
            if (!file.type.startsWith('audio/')) {
                showStatus('❌ 請選擇音頻檔案 (MP3, WAV, OGG 等)', 'error');
                return;
            }
            
            // 顯示上傳狀態
            showStatus('⏳ 正在加載檔案：' + file.name, 'info');
            
            // 創建臨時URL
            const url = URL.createObjectURL(file);
            
            // 更新audio元素
            audio.src = url;
            audio.load();
            
            // 更新標題
            document.querySelector('h1').textContent = file.name + ' 播放器';
            
            // 播放新檔案
            setTimeout(() => {
                audio.play().catch(e => {
                    showStatus('✅ 檔案加載完成！點擊播放按鈕開始', 'success');
                });
            }, 500);
        });
        
        // 初始化音量顯示
        volumeValue.textContent = Math.round(audio.volume * 100) + '%';
        
        // 自動嘗試播放（可能會被瀏覽器阻止）
        window.addEventListener('click', function initAudio() {
            // 嘗試自動播放一次
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(() => {
                // 被阻止是正常的
                console.log('需要用戶交互才能自動播放');
            });
            
            // 移除監聽器，只執行一次
            window.removeEventListener('click', initAudio);
        });
        
        // 頁面加載完成顯示狀態
        window.addEventListener('load', function() {
            showStatus('🔍 正在檢查音頻檔案...', 'info');
            
            // 檢查音頻是否已加載
            if (audio.readyState >= 2) {
                showStatus('✅ 音頻已準備好', 'success');
            }
        });
    </script>
</body>
</html>
